[package]
name = "rustcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "x11",
    "bevy_state",
    "default_font",
    "png",
] }

# Keep local verification lightweight while the project is still an application shell.
[profile.dev]
debug = 0
incremental = false
opt-level = 1

# Bevy's render stack is extremely slow without optimization, even when the
# game itself is built in the regular development profile.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = "symbols"
